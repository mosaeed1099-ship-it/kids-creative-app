<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Print Center — Example</title>
<link rel="stylesheet" href="../css/print-center.css" />
<style> html, body { height: 100%; margin: 0; background: #f6f4ff; } #app { min-height: 100%; } </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import PrintCenter from '../js/modules/print-center/index.js';
    import { ContentManager } from '../js/content/index.js';

    const base = new URL('../js/modules/print-center/content/', location.href).href;
    const content = new ContentManager({ base });
    await content.init({ catalog: 'catalog.json' });
    await content.loadPack('printables');

    const pc = new PrintCenter({
      mount: '#app',
      content,
      options: { resolveAsset: (item) => new URL(item.asset.src, base).href },
    });
    pc.mount();

    window.__pc = pc;
  </script>
</body>
</html>
