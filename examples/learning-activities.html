<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>الأنشطة التعليمية — Learning Activities</title>
<link rel="stylesheet" href="../css/learning-activities.css" />
<style>
  html, body { height: 100%; margin: 0; background: #f6f4ff; }
  #app { min-height: 100%; }
  .boot { display: grid; place-items: center; height: 100vh; font-family: system-ui; color: #8a8aa3; }
</style>
</head>
<body>
  <div id="app"><div class="boot">جارٍ تحميل الأنشطة…</div></div>

  <script type="module">
    import LearningActivities from '../js/modules/learning-activities/index.js';
    import { ContentManager } from '../js/content/index.js';

    const base = new URL('../js/modules/learning-activities/content/', location.href).href;
    const content = new ContentManager({ base });
    await content.init({ catalog: 'catalog.json' });
    await content.loadPack('activities');

    document.querySelector('#app').replaceChildren();
    const la = new LearningActivities({ mount: '#app', content });
    la.mount();

    window.__la = la;   // for manual testing in the console
  </script>
</body>
</html>
